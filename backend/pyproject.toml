[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booked-backend"
version = "0.1.0"
description = "Booked: domain logic, scan evaluation harness and (later) the API"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.6",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"booked.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
